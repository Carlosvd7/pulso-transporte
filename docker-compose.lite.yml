# Modo ligero para servidores pequeños (Oracle Always Free AMD, 1 GB de RAM).
# Toda la tubería en un proceso, sin Redpanda (ver src/pulso/lite.py), detrás de Caddy (HTTPS).
#   docker compose -f docker-compose.lite.yml up -d --build
name: pulso

services:
  web:
    build: .
    image: pulso-transporte:local
    command: ["lite", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
    mem_limit: 700m
    stop_grace_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      PULSO_DOMAIN: ${PULSO_DOMAIN:?Define PULSO_DOMAIN en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 100m
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
